name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked python -m compileall -q app scripts alembic
      - run: make migration-check
      - run: make format-check
      - run: make lint
      - run: make unit
      - run: make integration
        env:
          DATABASE_URL: 'sqlite+pysqlite:///:memory:'
          JWT_SECRET: ci-placeholder
          CORS_ORIGINS: http://localhost:5173
          APP_ENV: test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://backend:backend@localhost:5432/backend_test
      TEST_POSTGRES_URL: postgresql+psycopg://backend:backend@localhost:5432/backend_test
      JWT_SECRET: ci-placeholder
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: make migration-check
      - run: make migrate-head
      - run: make integration-postgres
